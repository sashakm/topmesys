# Release pipeline, driven by release-plz (configuration: release-plz.toml).
#
#   push to main ──▶ release-pr: open or update the release PR
#                    (version bump, CHANGELOG.md, cargo-semver-checks report)
#   merge that PR ─▶ pending:    is the pushed commit a merged release PR?
#                    release:    once a reviewer of the `release` environment approves,
#                                publish to crates.io, tag v<version>, create the
#                                GitHub release
#
# The `release` environment is the gate before crates.io: its required reviewers approve
# each publish, and the trusted publisher on crates.io accepts only OIDC tokens issued to
# jobs in it (RELEASING.md). `pending` applies the test release-plz itself applies for
# `release_always = false` (the commit belongs to a merged PR from a `release-plz-`
# branch), so an ordinary push to main asks nobody for an approval.
#
# Secrets:
#   RELEASE_PLZ_TOKEN  optional, recommended. A fine-grained PAT or GitHub App token with
#                      contents + pull-requests write. Pull requests opened with the
#                      default GITHUB_TOKEN do not trigger other workflows, so without it
#                      CI never runs on the release PR.
#
# crates.io authentication is trusted publishing (OIDC, `id-token: write`): no registry
# token is stored here. Configure the trusted publisher on crates.io first, see
# RELEASING.md.
name: release-plz

on:
  push:
    branches:
      - main

jobs:
  pending:
    name: Check for a merged release PR
    if: ${{ github.repository_owner == 'sashakm' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      release: ${{ steps.check.outputs.release }}
    steps:
      - name: Is the pushed commit a merged release PR?
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          release="$(gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/pulls" \
            --jq 'any(.[]; .merged_at != null and (.head.ref | startswith("release-plz-")))')"
          echo "release=$release" >> "$GITHUB_OUTPUT"

  release:
    name: Publish merged release
    needs: pending
    if: ${{ needs.pending.outputs.release == 'true' }}
    runs-on: ubuntu-latest
    environment:
      name: release
      url: https://crates.io/crates/topmesys
    permissions:
      contents: write
      pull-requests: read
      id-token: write
    # No concurrency group: a pending release must never be cancelled by a newer push.
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - name: Run release-plz release
        uses: release-plz/action@v0.5
        with:
          command: release
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_PLZ_TOKEN || secrets.GITHUB_TOKEN }}

  release-pr:
    name: Open or update the release PR
    if: ${{ github.repository_owner == 'sashakm' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    concurrency:
      group: release-plz-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - name: Run release-plz release-pr
        uses: release-plz/action@v0.5
        with:
          command: release-pr
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_PLZ_TOKEN || secrets.GITHUB_TOKEN }}
